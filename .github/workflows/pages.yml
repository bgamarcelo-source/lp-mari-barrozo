# Publica a prévia no GitHub Pages a cada push no main, para apresentar e validar.
# A prévia sai com noindex; na publicação no domínio próprio, este arquivo sai.
name: Prévia no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit && bunx vite build --base /lp-mari-barrozo/
      - name: Marcar a prévia como noindex
        run: sed -i 's#<head>#<head>\n    <meta name="robots" content="noindex, nofollow" />#' dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
